<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="../style.css">

    <style>

</head>

            <div class="course-detail-page">

                    <div class="cd-header-left">

                        <div class="cd-title-group">
                            <div class="cd-icon-box red-shadow"><i data-lucide="book"></i></div>
                            <div class="cd-info-main">
                                <h2>📚 C1</h2>
                                <div class="cd-badges">
                                    <span class="cd-badge"><i data-lucide="layers"></i> 66 bộ từ</span>
                                    <span class="cd-badge light"><i data-lucide="book"></i> 2392 từ vựng</span>
                                    <span class="cd-badge percent-purple">0% hoàn thành</span>
                                </div>
                            </div>

                    </div>
                    <div class="cd-header-right">
                        <div class="cd-actions-secondary">

                        </div>
                        <button class="btn-cd-primary glow-cyan"><i data-lucide="clock"></i> Học ngắt quãng</button>
                    </div>
                </div>
                <div class="cd-progress-section">

                <div class="subset-section">

                                <div class="subset-index">#1</div>
                            </div>
                            <div class="subset-card-middle">

                                </div>
                                <div class="subset-progress-bar"><div class="subset-progress-fill" style="width:0%"></div></div>
                            </div>
                            <div class="subset-card-right">
                                <div class="subset-play-action"><i data-lucide="play"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
