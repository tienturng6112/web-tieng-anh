<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETS 2024 | Ma Đạo Tông Sư</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Philosopher:ital,wght@1,700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script><script src="../database.js"></script><script src="../tracker.js"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../responsive.css">
    <style>
        .subset-index-circle {
            width: 44px;
            height: 44px;
            background: #252a35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .subset-card.locked .subset-index-circle {
            background: #252a35;
            color: #64748b;
        }
        .icon-inline {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
            margin-top: -2px;
            color: #f2c94c;
        }
        .cd-badge.percent-purple {
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
        }
        .orange-shadow {
            box-shadow: 0 8px 16px rgba(245, 158, 11, 0.3) !important;
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <span class="logo-text">Ma Đạo Tông Sư</span>
            </div>
            <nav class="nav-menu">
                <a href="../index.html" class="nav-item">
                    <i data-lucide="home"></i>
                    <span>Trang chủ</span>
                </a>
                <a href="#" class="nav-item active">
                    <i data-lucide="layers"></i>
                    <span>Bộ từ vựng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="book-open"></i>
                    <span>Từ vựng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="gamepad-2"></i>
                    <span>Game phản xạ</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="shopping-bag"></i>
                    <span>Cửa hàng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="bar-chart-2"></i>
                    <span>Xếp hạng</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="collapse-btn">
                    <i data-lucide="chevrons-left"></i>
                </button>
                <div class="user-profile">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user1" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span class="user-name">Trung Tien Tr...</span>
                    </div>
                </div>
                <div class="theme-toggle">
                    <div class="points">
                        <i data-lucide="coins" class="coin-icon"></i>
                        <span>110</span>
                    </div>
                    <div class="mode">
                        <i data-lucide="sun"></i>
                        <span>Sáng</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-right">
                    <div class="streak-badge">
                        <i data-lucide="flame"></i>
                        <span>1</span>
                    </div>
                    <button class="upgrade-btn">
                        <i data-lucide="zap"></i>
                        NÂNG CẤP PRO
                    </button>
                </div>
            </header>

            <!-- Course Detail View -->
            <div class="course-detail-page">
                <div class="cd-header">
                    <div class="cd-header-left">
                        <a href="../index.html" class="cd-back-btn" title="Quay lại">
                            <i data-lucide="arrow-left"></i>
                        </a>
                        <div class="cd-title-group">
                            <div class="cd-icon-box orange-shadow">
                                <i data-lucide="book"></i>
                            </div>
                            <div class="cd-info-main">
                                <h2>📚 ETS 2024</h2>
                                <div class="cd-badges">
                                    <span class="cd-badge"><i data-lucide="layers"></i> 20 bộ từ</span>
                                    <span class="cd-badge light"><i data-lucide="book"></i> 1600 từ vựng</span>
                                    <span class="cd-badge percent-purple">0% hoàn thành</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cd-header-right">
                        <div class="cd-actions-secondary">
                            <button class="btn-cd-secondary"><i data-lucide="pin" class="icon-sm"></i> Ghim</button>
                            <button class="btn-cd-secondary"><i data-lucide="award" class="icon-sm"></i> BXH</button>
                        </div>
                        <button class="btn-cd-primary glow-cyan">
                            <i data-lucide="clock"></i> Học ngắt quãng
                        </button>
                    </div>
                </div>

                <div class="cd-progress-section">
                    <div class="cd-progress-info">
                        Tiến độ: <span class="white-text">0/1600 từ</span>
                    </div>
                    <div class="cd-progress-bar-container">
                        <div class="cd-progress-bar-fill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="subset-section">
                    <div class="subset-header">
                        <h3>Các bộ từ</h3>
                        <button class="btn-unlock-pro">
                            <i data-lucide="crown"></i> Mở khóa
                        </button>
                    </div>
                    <div class="subset-grid" id="subset-grid">
                        <!-- Unit 1 -->
                        <div class="subset-card active">
                            <div class="subset-card-left">
                                <div class="subset-icon-wrapper">📁</div>
                                <div class="subset-index">#1</div>
                            </div>
                            <div class="subset-card-middle">
                                <h4>Test 1 LISTENING</h4>
                                <div class="subset-stats-row">
                                    <span class="subset-words">0 / 80 từ</span>
                                    <span class="subset-percent">0%</span>
                                </div>
                                <div class="subset-progress-bar">
                                    <div class="subset-progress-fill" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="subset-card-right">
                                <div class="subset-play-action">
                                    <i data-lucide="play"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Data from screenshot
        const units = [];
        for (let i = 1; i <= 10; i++) {
            units.push({ id: (i*2)-1, name: `Test ${i} LISTENING`, words: 80 });
            units.push({ id: i*2, name: `Test ${i} READING`, words: 80 });
        }
        // Correct order based on screenshot: indices 1, 2, 3, 4... corresponds to Test 1 LIST, Test 1 READ, Test 2 LIST, Test 2 READ...
        // Wait, screenshot shows:
        // 1: Test 1 LISTENING
        // 2: Test 1 READING
        // 3: Test 2 LISTENING
        // 4: Test 2 READING
        // Yes, my loop logic stands. But I need to start from ID 2 for the units array since ID 1 is already in HTML.
        
        const unitsArray = [];
        for (let i = 1; i <= 10; i++) {
            unitsArray.push({ id: (i*2)-1, name: `Test ${i} LISTENING`, words: 80 });
            unitsArray.push({ id: i*2, name: `Test ${i} READING`, words: 80 });
        }
        
        // Remove the first one as it's hardcoded
        unitsArray.shift();

        const grid = document.getElementById('subset-grid');
        
        unitsArray.forEach(unit => {
            const card = document.createElement('div');
            card.className = 'subset-card locked';
            card.innerHTML = `
                <div class="subset-card-left">
                    <div class="subset-index-circle">#${unit.id}</div>
                </div>
                <div class="subset-card-middle">
                    <h4><i data-lucide="lock" class="icon-inline"></i> ${unit.name}</h4>
                    <div class="subset-stats-row">
                        <span class="subset-words">${unit.words} từ</span>
                    </div>
                </div>
                <span class="pro-badge-small">PRO</span>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();
    </script>
</body>
</html>
