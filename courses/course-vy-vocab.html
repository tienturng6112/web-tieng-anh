<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VY VOCAB | Ma Đạo Tông Sư</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Philosopher:ital,wght@1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script><script src="../database.js"></script><script src="../tracker.js"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../responsive.css">
    <style>
        .subset-index-circle { width:44px;height:44px;background:#252a35;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#94a3b8;flex-shrink:0; }
        .subset-card.locked .subset-index-circle { background:#252a35;color:#64748b; }
        .icon-inline { width:14px;height:14px;vertical-align:middle;margin-right:4px;margin-top:-2px;color:#ec4899; }
        .cd-badge.percent-purple { background:rgba(168,85,247,0.1);color:#a855f7; }
        .pink-shadow { box-shadow:0 8px 16px rgba(236,72,153,0.3) !important;background:linear-gradient(135deg,#ec4899,#db2777) !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo"><span class="logo-text">Ma Đạo Tông Sư</span></div>
            <nav class="nav-menu">
                <a href="../index.html" class="nav-item"><i data-lucide="home"></i><span>Trang chủ</span></a>
                <a href="#" class="nav-item active"><i data-lucide="layers"></i><span>Bộ từ vựng</span></a>
                <a href="#" class="nav-item"><i data-lucide="book-open"></i><span>Từ vựng</span></a>
                <a href="#" class="nav-item"><i data-lucide="gamepad-2"></i><span>Game phản xạ</span></a>
                <a href="#" class="nav-item"><i data-lucide="shopping-bag"></i><span>Cửa hàng</span></a>
                <a href="#" class="nav-item"><i data-lucide="bar-chart-2"></i><span>Xếp hạng</span></a>
            </nav>
            <div class="sidebar-footer">
                <button class="collapse-btn"><i data-lucide="chevrons-left"></i></button>
                <div class="user-profile">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user1" alt="Avatar" class="avatar">
                    <div class="user-info"><span class="user-name">Trung Tien Tr...</span></div>
                </div>
                <div class="theme-toggle">
                    <div class="points"><i data-lucide="coins" class="coin-icon"></i><span>110</span></div>
                    <div class="mode"><i data-lucide="sun"></i><span>Sáng</span></div>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <header class="top-header">
                <div class="header-right">
                    <div class="streak-badge"><i data-lucide="flame"></i><span>1</span></div>
                    <button class="upgrade-btn"><i data-lucide="zap"></i> NÂNG CẤP PRO</button>
                </div>
            </header>
            <div class="course-detail-page">
                <div class="cd-header">
                    <div class="cd-header-left">
                        <a href="../index.html" class="cd-back-btn" title="Quay lại"><i data-lucide="arrow-left"></i></a>
                        <div class="cd-title-group">
                            <div class="cd-icon-box pink-shadow"><i data-lucide="book"></i></div>
                            <div class="cd-info-main">
                                <h2>📚 VY VOCAB</h2>
                                <p style="color:#94a3b8;font-size:0.9rem;margin-top:4px;">Từ vựng theo phong cách Vy Vocab</p>
                                <div class="cd-badges">
                                    <span class="cd-badge"><i data-lucide="layers"></i> 0 bộ từ</span>
                                    <span class="cd-badge light"><i data-lucide="book"></i> 0 từ vựng</span>
                                    <span class="cd-badge percent-purple">Sắp ra mắt</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cd-header-right">
                        <div class="cd-actions-secondary">
                            <button class="btn-cd-secondary"><i data-lucide="pin" class="icon-sm"></i> Ghim</button>
                            <button class="btn-cd-secondary"><i data-lucide="award" class="icon-sm"></i> BXH</button>
                        </div>
                        <button class="btn-cd-primary glow-cyan"><i data-lucide="clock"></i> Học ngắt quãng</button>
                    </div>
                </div>
                <div class="cd-progress-section">
                    <div class="cd-progress-info">Tiến độ: <span class="white-text">0/0 từ</span></div>
                    <div class="cd-progress-bar-container"><div class="cd-progress-bar-fill" style="width:0%"></div></div>
                </div>
                <div class="subset-section">
                    <div class="subset-header">
                        <h3>Các bộ từ</h3>
                        <button class="btn-unlock-pro"><i data-lucide="crown"></i> Mở khóa</button>
                    </div>
                    <div class="subset-grid" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;text-align:center;">
                        <i data-lucide="clock" style="width:48px;height:48px;color:#94a3b8;"></i>
                        <h3 style="color:#94a3b8;font-size:1.1rem;">Nội dung đang được cập nhật</h3>
                        <p style="color:#64748b;font-size:0.9rem;">Các bộ từ VY VOCAB sẽ sớm được ra mắt. Hãy quay lại sau nhé!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
