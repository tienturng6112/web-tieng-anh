<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambridge Practice Tests for IELTS (12-14) | Ma Đạo Tông Sư</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Philosopher:ital,wght@1,700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        .subset-index-circle {
            width: 44px;
            height: 44px;
            background: #252a35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .subset-card.locked .subset-index-circle {
            background: #252a35;
            color: #64748b;
        }
        .icon-inline {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
            margin-top: -2px;
            color: #f2c94c;
        }
        .cd-badge.percent-purple {
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
        }
        .yellow-shadow {
            box-shadow: 0 8px 16px rgba(242, 201, 76, 0.3) !important;
            background: linear-gradient(135deg, #f2c94c, #f59e0b) !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <span class="logo-text">Ma Đạo Tông Sư</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i data-lucide="home"></i>
                    <span>Trang chủ</span>
                </a>
                <a href="#" class="nav-item active">
                    <i data-lucide="layers"></i>
                    <span>Bộ từ vựng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="book-open"></i>
                    <span>Từ vựng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="gamepad-2"></i>
                    <span>Game phản xạ</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="shopping-bag"></i>
                    <span>Cửa hàng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="bar-chart-2"></i>
                    <span>Xếp hạng</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="collapse-btn">
                    <i data-lucide="chevrons-left"></i>
                </button>
                <div class="user-profile">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user1" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span class="user-name">Trung Tien Tr...</span>
                    </div>
                </div>
                <div class="theme-toggle">
                    <div class="points">
                        <i data-lucide="coins" class="coin-icon"></i>
                        <span>110</span>
                    </div>
                    <div class="mode">
                        <i data-lucide="sun"></i>
                        <span>Sáng</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-right">
                    <div class="streak-badge">
                        <i data-lucide="flame"></i>
                        <span>1</span>
                    </div>
                    <button class="upgrade-btn">
                        <i data-lucide="zap"></i>
                        NÂNG CẤP PRO
                    </button>
                </div>
            </header>

            <!-- Course Detail View -->
            <div class="course-detail-page">
                <div class="cd-header">
                    <div class="cd-header-left">
                        <a href="index.html" class="cd-back-btn" title="Quay lại">
                            <i data-lucide="arrow-left"></i>
                        </a>
                        <div class="cd-title-group">
                            <div class="cd-icon-box yellow-shadow">
                                <i data-lucide="book"></i>
                            </div>
                            <div class="cd-info-main">
                                <h2>📚 Cambridge Practice Tests for IELTS (12-14)</h2>
                                <div class="cd-badges">
                                    <span class="cd-badge"><i data-lucide="layers"></i> 39 bộ từ</span>
                                    <span class="cd-badge light"><i data-lucide="book"></i> 3584 từ vựng</span>
                                    <span class="cd-badge percent-purple">0% hoàn thành</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cd-header-right">
                        <div class="cd-actions-secondary">
                            <button class="btn-cd-secondary"><i data-lucide="pin" class="icon-sm"></i> Ghim</button>
                            <button class="btn-cd-secondary"><i data-lucide="award" class="icon-sm"></i> BXH</button>
                        </div>
                        <button class="btn-cd-primary glow-cyan">
                            <i data-lucide="clock"></i> Học ngắt quãng
                        </button>
                    </div>
                </div>

                <div class="cd-progress-section">
                    <div class="cd-progress-info">
                        Tiến độ: <span class="white-text">0/3584 từ</span>
                    </div>
                    <div class="cd-progress-bar-container">
                        <div class="cd-progress-bar-fill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="subset-section">
                    <div class="subset-header">
                        <h3>Các bộ từ</h3>
                        <button class="btn-unlock-pro">
                            <i data-lucide="crown"></i> Mở khóa
                        </button>
                    </div>
                    <div class="subset-grid" id="subset-grid">
                        <!-- Unit 1 -->
                        <div class="subset-card active">
                            <div class="subset-card-left">
                                <div class="subset-icon-wrapper">📁</div>
                                <div class="subset-index">#1</div>
                            </div>
                            <div class="subset-card-middle">
                                <h4>Cam 12 Test 1 Passage 1</h4>
                                <div class="subset-stats-row">
                                    <span class="subset-words">0 / 29 từ</span>
                                    <span class="subset-percent">0%</span>
                                </div>
                                <div class="subset-progress-bar">
                                    <div class="subset-progress-fill" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="subset-card-right">
                                <div class="subset-play-action">
                                    <i data-lucide="play"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Data for units 2-39 as per images
        const units = [
            { id: 2, name: "Cam 12 Test 1 Passage 2", words: 33 },
            { id: 3, name: "Cam 12 Test 1 Passage 3", words: 30 },
            { id: 4, name: "Cam 12 Test 2 Passage 1", words: 47 },
            { id: 5, name: "Cam 12 Test 2 Passage 2", words: 35 },
            { id: 6, name: "Cam 12 Test 2 Passage 3", words: 30 },
            { id: 7, name: "Cam 12 Test 3 Passage 1", words: 43 },
            { id: 8, name: "Cam 12 Test 3 Passage 2", words: 35 },
            { id: 9, name: "Cam 12 Test 3 Passage 3", words: 38 },
            { id: 10, name: "Cam 12 Test 4 Passage 1", words: 30 },
            { id: 11, name: "Cam 12 Test 4 Passage 2", words: 38 },
            { id: 12, name: "Cam 12 Test 4 Passage 3", words: 40 },
            { id: 13, name: "CAM 12 - Listening Test 1", words: 108 },
            { id: 14, name: "CAM 12 - Listening Test 2", words: 119 },
            { id: 15, name: "CAM 12 - Listening Test 3", words: 109 },
            { id: 16, name: "CAM 12- Listening Test 4", words: 113 },
            { id: 17, name: "CAM 13- Listening Test 1", words: 116 },
            { id: 18, name: "CAM 13- Reading Test 2", words: 323 },
            { id: 19, name: "CAM 13- Listening Test 2", words: 117 },
            { id: 20, name: "CAM 13- Reading Test 3", words: 267 },
            { id: 21, name: "CAM 13- Listening Test 3", words: 109 },
            { id: 22, name: "CAM 13- Reading Test 4", words: 272 },
            { id: 23, name: "CAM 13- Listening Test 4", words: 114 },
            { id: 24, name: "CAM 14- Listening Test 1", words: 188 },
            { id: 25, name: "CAM 14- Listening Test 2", words: 106 },
            { id: 26, name: "CAM 14- Listening Test 3", words: 107 },
            { id: 27, name: "CAM 14- Listening Test 4", words: 117 },
            { id: 28, name: "CAM 14 Test 1 - Reading Passage 1", words: 63 },
            { id: 29, name: "CAM 14 Test 1 - Reading Passage 2", words: 53 },
            { id: 30, name: "CAM 14 Test 1 - Reading Passage 3", words: 77 },
            { id: 31, name: "CAM 14 Test 2 - Reading Passage 1", words: 78 },
            { id: 32, name: "CAM 14 Test 2 - Reading Passage 2", words: 94 },
            { id: 33, name: "CAM 14 Test 2 - Reading Passage 3", words: 73 },
            { id: 34, name: "CAM 14 Test 3 - Reading Passage 1", words: 89 },
            { id: 35, name: "CAM 14 Test 3 - Reading Passage 2", words: 33 },
            { id: 36, name: "CAM 14 Test 3 - Reading Passage 3", words: 37 },
            { id: 37, name: "CAM 14 Test 4 - Reading Passage 1", words: 86 },
            { id: 38, name: "CAM 14 Test 4 - Reading Passage 2", words: 96 },
            { id: 39, name: "CAM 14 Test 4 - Reading Passage 3", words: 92 }
        ];

        const grid = document.getElementById('subset-grid');
        
        units.forEach(unit => {
            const card = document.createElement('div');
            card.className = 'subset-card locked';
            card.innerHTML = `
                <div class="subset-card-left">
                    <div class="subset-index-circle">${unit.id}</div>
                </div>
                <div class="subset-card-middle">
                    <h4><i data-lucide="lock" class="icon-inline"></i> ${unit.name}</h4>
                    <div class="subset-stats-row">
                        <span class="subset-words">${unit.words} từ</span>
                    </div>
                </div>
                <span class="pro-badge-small">PRO</span>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();
    </script>
</body>
</html>
