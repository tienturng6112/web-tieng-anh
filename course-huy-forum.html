<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUY FORUM | Ma Đạo Tông Sư</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Philosopher:ital,wght@1,700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        .subset-index-circle {
            width: 44px;
            height: 44px;
            background: #252a35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .subset-card.locked .subset-index-circle {
            background: #252a35;
            color: #64748b;
        }
        .icon-inline {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
            margin-top: -2px;
            color: #f2994a;
        }
        .cd-badge.percent-purple {
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
        }
        .orange-shadow {
            box-shadow: 0 8px 16px rgba(245, 158, 11, 0.3) !important;
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <span class="logo-text">Ma Đạo Tông Sư</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i data-lucide="home"></i>
                    <span>Trang chủ</span>
                </a>
                <a href="#" class="nav-item active">
                    <i data-lucide="layers"></i>
                    <span>Bộ từ vựng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="book-open"></i>
                    <span>Từ vựng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="gamepad-2"></i>
                    <span>Game phản xạ</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="shopping-bag"></i>
                    <span>Cửa hàng</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="bar-chart-2"></i>
                    <span>Xếp hạng</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="collapse-btn">
                    <i data-lucide="chevrons-left"></i>
                </button>
                <div class="user-profile">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user1" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span class="user-name">Trung Tien Tr...</span>
                    </div>
                </div>
                <div class="theme-toggle">
                    <div class="points">
                        <i data-lucide="coins" class="coin-icon"></i>
                        <span>110</span>
                    </div>
                    <div class="mode">
                        <i data-lucide="sun"></i>
                        <span>Sáng</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-right">
                    <div class="streak-badge">
                        <i data-lucide="flame"></i>
                        <span>1</span>
                    </div>
                    <button class="upgrade-btn">
                        <i data-lucide="zap"></i>
                        NÂNG CẤP PRO
                    </button>
                </div>
            </header>

            <!-- Course Detail View -->
            <div class="course-detail-page">
                <div class="cd-header">
                    <div class="cd-header-left">
                        <a href="index.html" class="cd-back-btn" title="Quay lại">
                            <i data-lucide="arrow-left"></i>
                        </a>
                        <div class="cd-title-group">
                            <div class="cd-icon-box orange-shadow">
                                <i data-lucide="book"></i>
                            </div>
                            <div class="cd-info-main">
                                <h2>📚 HUY FORUM</h2>
                                <div class="cd-badges">
                                    <span class="cd-badge"><i data-lucide="layers"></i> 38 bộ từ</span>
                                    <span class="cd-badge light"><i data-lucide="book"></i> 828 từ vựng</span>
                                    <span class="cd-badge percent-purple">0% hoàn thành</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cd-header-right">
                        <div class="cd-actions-secondary">
                            <button class="btn-cd-secondary"><i data-lucide="pin" class="icon-sm"></i> Ghim</button>
                            <button class="btn-cd-secondary"><i data-lucide="award" class="icon-sm"></i> BXH</button>
                        </div>
                        <button class="btn-cd-primary glow-cyan">
                            <i data-lucide="clock"></i> Học ngắt quãng
                        </button>
                    </div>
                </div>

                <div class="cd-progress-section">
                    <div class="cd-progress-info">
                        Tiến độ: <span class="white-text">0/828 từ</span>
                    </div>
                    <div class="cd-progress-bar-container">
                        <div class="cd-progress-bar-fill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="subset-section">
                    <div class="subset-header">
                        <h3>Các bộ từ</h3>
                        <button class="btn-unlock-pro">
                            <i data-lucide="crown"></i> Mở khóa
                        </button>
                    </div>
                    <div class="subset-grid" id="subset-grid">
                        <!-- Unit 1 -->
                        <div class="subset-card active">
                            <div class="subset-card-left">
                                <div class="subset-icon-wrapper">📁</div>
                                <div class="subset-index">#1</div>
                            </div>
                            <div class="subset-card-middle">
                                <h4>1.Super Vocab: Chủ đề TECHNOLOGY</h4>
                                <div class="subset-stats-row">
                                    <span class="subset-words">0 / 10 từ</span>
                                    <span class="subset-percent">0%</span>
                                </div>
                                <div class="subset-progress-bar">
                                    <div class="subset-progress-fill" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="subset-card-right">
                                <div class="subset-play-action">
                                    <i data-lucide="play"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Data based on images
        const units = [
            { id: 2, name: "2.Super Vocab: Chủ đề ENVIRONMENT", words: 10 },
            { id: 3, name: "3.Super Vocab: Chủ đề Kinh tế", words: 24 },
            { id: 4, name: "4.Super Vocab Chủ đề Science", words: 23 },
            { id: 5, name: "5. Super Vocab Chủ đề SOCIETY", words: 10 },
            { id: 6, name: "6. Super Vocab Chủ đề HEALTH", words: 10 },
            { id: 7, name: "7. Super Vocab Chủ đề Education", words: 10 },
            { id: 8, name: "8. Super Vocab Chủ đề Thể thao", words: 24 },
            { id: 9, name: "9.Super Vocab: Chủ đề Công việc và Nghề nghiệp", words: 25 },
            { id: 10, name: "10 .Super Vocab Gia đình và Mối quan hệ", words: 25 },
            { id: 11, name: "11. Super Vocab Môi trường Xã hội", words: 25 },
            { id: 12, name: "12. Super Vocab Công nghệ Thông tin", words: 24 },
            { id: 13, name: "13. Super Vocab Sức khỏe và Thể hình", words: 25 },
            { id: 14, name: "14. Super Vocab Giao thông", words: 25 },
            { id: 15, name: "15. Super Vocab Nhà ở", words: 25 },
            { id: 16, name: "16. Super vocab Ẩm thực", words: 24 },
            { id: 17, name: "17. IELTS Vocabulary Set 1", words: 47 },
            { id: 18, name: "VocabCD 1: Tin nhắn (Text Messages)", words: 18 },
            { id: 19, name: "VocabCD 2: Lập kế hoạch (Making Plans)", words: 18 },
            { id: 20, name: "VocabCD 3: Ghi nhớ (Memory)", words: 18 },
            { id: 21, name: "VocabCD 4: Kiên nhẫn (Patience)", words: 18 },
            { id: 22, name: "VocabCD 5: Viết tay/ Đánh máy (Writing)", words: 18 },
            { id: 23, name: "VocabCD 6: Lập danh sách (Making Lists)", words: 18 },
            { id: 24, name: "VocabCD 7: Bận rộn (Being Busy)", words: 18 },
            { id: 25, name: "VocabCD 1: Trang sức (Jewelry)", words: 24 },
            { id: 26, name: "VocabCD 2: Tên gọi (Names)", words: 24 },
            { id: 27, name: "VocabCD 3: Ở một mình (Spending Time Alone)", words: 24 },
            { id: 28, name: "VocabCD 4: Nói lời cảm ơn (Saying \"thank you\")", words: 24 },
            { id: 29, name: "VocabCD 5: Khen ngợi (Praising)", words: 24 },
            { id: 30, name: "VocabCD 6: Bộc lộ cảm xúc (Expressing Feelings)", words: 24 },
            { id: 31, name: "VocabCD 7: Lãnh đạo và làm việc nhóm (Leadership)", words: 24 },
            { id: 32, name: "Chủ đề 8: Học từ người khác (Learning from others)", words: 24 },
            { id: 33, name: "VocabCD 9: Văn hóa nấu nướng và ẩm thực (Cooking culture)", words: 24 },
            { id: 34, name: "VocabCD 10: Mối quan hệ gia đình (Family relationship)", words: 24 },
            { id: 35, name: "VocabCD 11: Giúp đỡ và sự hào phóng (Helpfulness and generosity)", words: 24 },
            { id: 36, name: "VocabCD 12: Lời khuyên, tranh luận & thảo luận", words: 24 },
            { id: 37, name: "VocabCD 13: Trung thực & Trách nhiệm (Honesty & Responsibility)", words: 24 },
            { id: 38, name: "VocabCD 14: Sự nổi tiếng & Trẻ em (Fame & Children)", words: 24 }
        ];

        const grid = document.getElementById('subset-grid');
        
        units.forEach(unit => {
            const card = document.createElement('div');
            card.className = 'subset-card locked';
            card.innerHTML = `
                <div class="subset-card-left">
                    <div class="subset-index-circle">#${unit.id}</div>
                </div>
                <div class="subset-card-middle">
                    <h4><i data-lucide="lock" class="icon-inline"></i> ${unit.name}</h4>
                    <div class="subset-stats-row">
                        <span class="subset-words">${unit.words} từ</span>
                    </div>
                </div>
                <span class="pro-badge-small">PRO</span>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();
    </script>
</body>
</html>
